<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Copilot in SharePoint Demonstrations</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #1e1e1e;
    color: #f0f0f0;
    min-height: 100vh;
  }
  header {
    background: #2b2b2b;
    padding: 16px 24px;
    border-bottom: 1px solid #3a3a3a;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 500; }
  header p  { margin: 4px 0 0; color: #a0a0a0; font-size: 13px; }
  header .actions { margin-top: 8px; }
  header button {
    background: #3a3a3a;
    color: #ddd;
    border: 1px solid #4a4a4a;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-right: 6px;
  }
  header button:hover { background: #4a4a4a; }

  main {
    padding: 16px 24px 32px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  /* ---------- Gallery sections (collapsible) ---------- */
  details.gallery {
    background: #262626;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    overflow: hidden;
  }
  details.gallery > summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
    background: #2f2f2f;
  }
  details.gallery > summary::-webkit-details-marker { display: none; }
  details.gallery > summary .caret {
    display: inline-block;
    font-size: 11px;
    color: #4a90e2;
    transition: transform .15s ease;
    flex: 0 0 auto;
    margin-top: 4px;
  }
  details.gallery[open] > summary .caret { transform: rotate(90deg); }
  details.gallery > summary .title-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  details.gallery > summary .title-block .title {
    font-size: 16px;
    font-weight: 500;
    color: #f0f0f0;
  }
  details.gallery > summary .title-block .description {
    font-size: 12px;
    color: #a0a0a0;
    font-weight: normal;
    line-height: 1.35;
  }
  details.gallery > summary .count {
    margin-left: auto;
    font-size: 12px;
    color: #a0a0a0;
    font-weight: normal;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .gallery-grid {
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 8px;
    cursor: pointer;
    background: #1e1e1e;
    border: 2px solid transparent;
    transition: transform .15s ease, border-color .15s ease;
  }
  .thumb:hover { transform: translateY(-2px); border-color: #4a90e2; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 6px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    font-size: 13px;
  }
  .empty {
    padding: 24px;
    color: #a0a0a0;
    font-style: italic;
  }

  /* ---------- Slideshow ---------- */
  #slideshow {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 20;
    flex-direction: column;
  }
  #slideshow.active { display: flex; }

  .slide-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,0,0,.6);
    color: #fff;
    gap: 12px;
  }
  .slide-bar button {
    background: #4a90e2;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .slide-bar button:hover { background: #357abd; }
  .counter { font-size: 14px; color: #ccc; }
  .gallery-name { font-size: 14px; color: #4a90e2; font-weight: 500; }

  .stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,.5);
    color: #fff;
    border: none;
    font-size: 32px;
    width: 56px;
    height: 72px;
    cursor: pointer;
    user-select: none;
  }
  .nav:hover { background: rgba(74,144,226,.8); }
  .nav.prev { left: 12px; border-radius: 0 6px 6px 0; }
  .nav.next { right: 12px; border-radius: 6px 0 0 6px; }
  .caption {
    text-align: center;
    padding: 10px;
    background: rgba(0,0,0,.6);
    color: #ddd;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>Copilot in SharePoint Demonstrations</h1>
  <p>Select a scenario to start demonstration. Click any thumbnail to launch the slideshow — use ← → keys or on-screen buttons to navigate, and press Esc to return.</p>
  <div class="actions">
    <button id="expandAll">Expand all</button>
    <button id="collapseAll">Collapse all</button>
  </div>
</header>

<main id="home"></main>

<section id="slideshow" aria-hidden="true">
  <div class="slide-bar">
    <button id="homeBtn">← Home</button>
    <span class="gallery-name" id="galleryName"></span>
    <span class="counter" id="counter"></span>
  </div>
  <div class="stage">
    <button class="nav prev" id="prevBtn" aria-label="Previous">‹</button>
    <img id="slideImg" alt="" />
    <button class="nav next" id="nextBtn" aria-label="Next">›</button>
  </div>
  <div class="caption" id="caption"></div>
</section>

<script src="galleries.js"></script>
<script>
  const home        = document.getElementById("home");
  const slideshow   = document.getElementById("slideshow");
  const slideImg    = document.getElementById("slideImg");
  const counter     = document.getElementById("counter");
  const galleryName = document.getElementById("galleryName");
  const caption     = document.getElementById("caption");
  const homeBtn     = document.getElementById("homeBtn");
  const prevBtn     = document.getElementById("prevBtn");
  const nextBtn     = document.getElementById("nextBtn");

  let currentGallery = 0;
  let currentImage   = 0;

  const fileName = (path) => path.split("/").pop();

  function renderHome() {
    home.innerHTML = "";
    if (!Array.isArray(galleries) || galleries.length === 0) {
      home.innerHTML = `<div class="empty">No galleries found. Add subfolders with images, then re-run <code>generate-manifest.ps1</code>.</div>`;
      return;
    }
    galleries.forEach((g, gi) => {
      const details = document.createElement("details");
      details.className = "gallery";
      details.open = true;

      const summary = document.createElement("summary");
      const title = g.title || g.folder || g.name || "Untitled";
      const desc  = g.description || "";
      summary.innerHTML = `
        <span class="caret">▶</span>
        <span class="title-block">
          <span class="title"></span>
          ${desc ? `<span class="description"></span>` : ""}
        </span>
        <span class="count">${g.images.length} image${g.images.length === 1 ? "" : "s"}</span>
      `;
      summary.querySelector(".title").textContent = title;
      if (desc) summary.querySelector(".description").textContent = desc;
      details.appendChild(summary);

      const grid = document.createElement("div");
      grid.className = "gallery-grid";
      g.images.forEach((src, ii) => {
        const div = document.createElement("div");
        div.className = "thumb";
        div.innerHTML = `
          <img src="${src}" alt="${fileName(src)}" loading="lazy" />
          <div class="label">${fileName(src)}</div>
        `;
        div.addEventListener("click", () => openSlideshow(gi, ii));
        grid.appendChild(div);
      });
      details.appendChild(grid);
      home.appendChild(details);
    });
  }

  function openSlideshow(gi, ii) {
    currentGallery = gi;
    currentImage   = ii;
    updateSlide();
    slideshow.classList.add("active");
    slideshow.setAttribute("aria-hidden", "false");
  }

  function closeSlideshow() {
    slideshow.classList.remove("active");
    slideshow.setAttribute("aria-hidden", "true");
  }

  function updateSlide() {
    const g = galleries[currentGallery];
    const src = g.images[currentImage];
    slideImg.src = src;
    slideImg.alt = fileName(src);
    galleryName.textContent = g.title || g.folder || "";
    counter.textContent = `${currentImage + 1} / ${g.images.length}`;
    caption.textContent = fileName(src);
  }

  // Navigation stays within the current gallery and wraps around.
  function next() {
    const total = galleries[currentGallery].images.length;
    currentImage = (currentImage + 1) % total;
    updateSlide();
  }
  function prev() {
    const total = galleries[currentGallery].images.length;
    currentImage = (currentImage - 1 + total) % total;
    updateSlide();
  }

  homeBtn.addEventListener("click", closeSlideshow);
  nextBtn.addEventListener("click", next);
  prevBtn.addEventListener("click", prev);

  document.getElementById("expandAll").addEventListener("click", () => {
    document.querySelectorAll("details.gallery").forEach(d => d.open = true);
  });
  document.getElementById("collapseAll").addEventListener("click", () => {
    document.querySelectorAll("details.gallery").forEach(d => d.open = false);
  });

  document.addEventListener("keydown", (e) => {
    if (!slideshow.classList.contains("active")) return;
    if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === "Escape" || e.key === "Home") closeSlideshow();
  });

  renderHome();
</script>
</body>
</html>
